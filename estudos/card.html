<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>preços</title>
    <link rel="stylesheet" href="card.css">

<body>
    <div class="wrapper">
        <input type="radio" name="slider" id="tab-1">

            <div class="slider"></div>

        <div class="cards-area">

                    </div>

                        <li><i class="fas fa-check"></i><span>lalalalalalla</span></li>

                        <li><i class="fas fa-check"></i><span>lililililili</span></li>

                    </ul>
                </div>
                <div class="row">
                    <div class="pricing-details">
                        <span>99</span>
                        <p>for professional use</p>
                    </div>
                    <ul class="features">

                        <li><i class="fas fa-check"></i><span>lalalalalalla</span></li>
                        <li><i class="fas fa-check"></i><span>lellelelelelele</span></li>
                        <li><i class="fas fa-check"></i><span>lililililili</span></li>
                        <li><i class="fas fa-check"></i><span>lolololololo</span></li>
                    </ul>
                </div>
                <div class="row">
                    <div class="pricing-details">
                        <span>49</span>
                        <p>for team colaboration</p>
                    </div>
                    <ul class="features">

                        <li><i class="fas fa-check"></i><span>lalalalalalla</span></li>
                        <li><i class="fas fa-check"></i><span>lellelelelelele</span></li>
                        <li><i class="fas fa-check"></i><span>lililililili</span></li>
                        <li><i class="fas fa-check"></i><span>lolololololo</span></li>
                    </ul>
                </div>
            </div>
        </div>
        <button>choose plan</button>
    </div>

    </div>
</body>
