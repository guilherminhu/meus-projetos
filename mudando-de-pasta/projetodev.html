<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela de preços</title>
    <link rel="stylesheet" href="projetodev.css">
</head>

<body>
    <div class="caixa-grande">
        <input type="radio" name="deslizar" id="tab-1">
        <input type="radio" name="deslizar" id="tab-2">
        <input type="radio" name="deslizar" id="tab-3">

        <header>
            <label for="tab-1" class="tab-1">básico</label>
            <label for="tab-2" class="tab-2">médio</label>
            <label for="tab-3" class="tab-3">deluxe</label>

            <div class="deslizar"></div>

        </header>

        <div class="cartões-area">

            <div class="cartões">

                <div class="linha linha-1">

                    <div class="detalhes-do-preço">
                        <span>20</span>
                        <p>plano inicial</p>

                    </div>

                    <ul class="caracteristicas">
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>

                    </ul>
                </div>
                <div class="linha">

                    <div class="detalhes-do-preço">
                        <span>30</span>
                        <p>intermediário</p>

                    </div>

                    <ul class="caracteristicas">
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>

                    </ul>
                </div>
                <div class="linha">

                    <div class="detalhes-do-preço">
                        <span>40</span>
                        <p>plano premium</p>

                    </div>

                    <ul class="caracteristicas">
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>
                        <li><i class="check"></i><span>-------------</span></li>

                    </ul>
                </div>
            </div>

        </div>

        <button>escolher plano</button>
    </div>

</body>
